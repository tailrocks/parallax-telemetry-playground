spring:
  application:
    name: payment
  grpc:
    server:
      health:
        service:
          "[playground.payment.v1.Payment]":
            include:
              - db
  datasource:
    url: ${PAYMENT_DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/playground}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:playground}}
  sql:
    init:
      mode: never
payment:
  provider: ${PAYMENT_PROVIDER:playground}
  reconciliation:
    fixed-delay-ms: ${PAYMENT_RECONCILIATION_FIXED_DELAY_MS:250}
    initial-delay-ms: ${PAYMENT_RECONCILIATION_INITIAL_DELAY_MS:100}
    batch-size: ${PAYMENT_RECONCILIATION_BATCH_SIZE:32}
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${PARALLAX_ENV:playground}
  release: ${RELEASE:0.1.0}
  traces-sample-rate: 1.0
  # A17: continuous profiling — JVM async-profiler (GA since Sentry SDK 8.23, we
  # run 8.46). profile-lifecycle=trace ties the profiler to sampled traces, so a
  # CPU-hot path (e.g. payment high-CPU chaos, B5) yields a trace-linked profile.
  profile-session-sample-rate: 1.0
  profile-lifecycle: trace
# OTel Java agent exemplar sampling is configured by
# OTEL_METRICS_EXEMPLAR_FILTER in compose.
logging:
  pattern:
    level: "trace_id=%mdc{trace_id} span_id=%mdc{span_id} %5p"
