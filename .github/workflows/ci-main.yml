  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs: [plan, velnor-lane-admission, policy, github-bun-playground-web, velnor-bun-playground-web, github-docker-deploy, velnor-docker-deploy, github-gradle-services-catalog, velnor-gradle-services-catalog, github-gradle-services-fulfillment, velnor-gradle-services-fulfillment, github-gradle-services-payment, velnor-gradle-services-payment, prepare-cargo, github-rust-checkout, velnor-rust-checkout, github-rust-inventory, velnor-rust-inventory, github-rust-notifications, velnor-rust-notifications, github-rust-orders, velnor-rust-orders, github-rust-playground-cli, velnor-rust-playground-cli, github-rust-playground-proto, velnor-rust-playground-proto, github-rust-playground-telemetry, velnor-rust-playground-telemetry, github-rust-pricing, velnor-rust-pricing, github-rust-recommendation, velnor-rust-recommendation, github-rust-storefront, velnor-rust-storefront, github-swift-package-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate generated stack results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SELECTED_UNITS: ${{ needs.plan.outputs.units }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          result_for_job() {
            jq -r --arg job "$1" '.[$job].result // empty' <<<"$NEEDS_JSON"
          }
          result="$(result_for_job plan)"
          if [[ "$result" != success ]]; then
            echo "required CI prerequisite plan did not pass: $result" >&2
            exit 1
          fi
          result="$(result_for_job policy)"
          if [[ "$result" != success ]]; then
            echo "required CI prerequisite policy did not pass: $result" >&2
            exit 1
          fi
          result="$(result_for_job velnor-lane-admission)"
          case "$result" in
            success|skipped) ;;
            *) echo "required CI prerequisite velnor-lane-admission did not pass: $result" >&2; exit 1 ;;
          esac
          selected=",$SELECTED_UNITS,"
          if [[ "$selected" == *",bun-playground-web,"* ]]; then
            result="$(result_for_job github-bun-playground-web)"
            case "$result" in
              success) ;;
              *) echo "selected CI job github-bun-playground-web did not pass: $result" >&2; exit 1 ;;
            esac
          else
            result="$(result_for_job github-bun-playground-web)"
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI job github-bun-playground-web failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          if [[ "$selected" == *",bun-playground-web,"* ]]; then
            result="$(result_for_job velnor-bun-playground-web)"
            if [[ "$FORK_PR" == true ]]; then
              case "$result" in
                success|skipped) ;;
                *) echo "selected CI job velnor-bun-playground-web did not pass: $result" >&2; exit 1 ;;
              esac
            else
