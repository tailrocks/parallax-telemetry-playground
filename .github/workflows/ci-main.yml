              esac
            else
              case "$result" in
                skipped) ;;
                *) echo "selected CI job github-bun-playground-web ran outside its lane admission (LANE_ADMITTED_GITHUB=$LANE_ADMITTED_GITHUB): $result" >&2; exit 1 ;;
