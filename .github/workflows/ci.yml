  rust-recommendation:
    name: Rust / recommendation
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      MBX_BUILD_SCRIPT_EXECUTION: "0"
      MBX_CC: "0"
      MBX_GC_AUTO: "0"
