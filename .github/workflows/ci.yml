lse printf '\\''MBX_DISK_SAMPLE_ERROR boundary=%s path=mbx_store command=du\\n'\\'' \"$boundary\" >&2; fi; else printf '\\''MBX_DISK_SAMPLE_ERROR boundary=%s path=mbx_store_unavailable\\n'\\'' \"$boundary\" >&2; fi; target_path=\"${target_dir:-target}\"; if [ ! -d \"$target_path\" ]; then for candidate in */target crates/*/target \"$RUNNER_TEMP/velnor/target\"; do if [ -d \"$candidate\" ]; then target_path=\"$candidate\"; break; fi; done; fi; if [ -L \"$target_path\" ]; then printf '\\''MBX_DISK_SAMPLE_ERROR boundary=%s path=target_is_symlink\\n'\\'' \"$boundary\" >&2; elif [ -d \"$target_path\" ]; then printf '\\''MBX_DISK_ALLOCATED_KIB boundary=%s root=target\\n'\\'' \"$boundary\"; if du -sk \"$target_path\"; then :; else printf '\\''MBX_DISK_SAMPLE_ERROR boundary=%s path=target command=du\\n'\\'' \"$boundary\" >&2; fi; else printf '\\''MBX_DISK_ALLOCATED_KIB boundary=%s root=target state=absent\\n'\\'' \"$boundary\"; fi; }; target_dir=\"target\"; mbx_disk_sample before-final-clean; if ! mbx_bin=$(command -v mbx); then printf '\\''%s\\n'\\'' '\\''action-owned MBX is not on PATH'\\'' >&2; exit 1; fi; case \"$mbx_bin\" in /*) ;; *) printf '\\''%s\\n'\\'' '\\''action-owned MBX path must be absolute'\\'' >&2; exit 1 ;; esac; if [ ! -f \"$mbx_bin\" ] || [ ! -x \"$mbx_bin\" ]; then printf '\\''%s\\n'\\'' '\\''action-owned MBX path must be an executable file'\\'' >&2; exit 1; fi; clean_status=0; if mise --no-config --no-env --no-hooks exec rust@1.97.1 -- \"$mbx_bin\" cache dir >/dev/null 2>&1; then clean_status=0; else clean_status=$?; fi; if [ -d \"$target_dir\" ] && [ ! -L \"$target_dir\" ]; then rm -rf \"$target_dir/velnor-cli-nested-cargo\" \"$target_dir/tmp\" \"$target_dir/debug/examples\" \"$target_dir/debug/incremental\"; python3 -c '\\''exec(\"import os, pathlib, shutil, subprocess, sys\\ntd = pathlib.Path(sys.argv[1])\\ndbg = td / \\\"debug\\\"\\nif dbg.is_dir() and not dbg.is_symlink():\\n    shims = dbg / \\\".mbx-build-script-shims\\\"\\n    os.makedirs(shims, exist_ok=True)\\n    vdoc = shims / \\\".velnor-doc\\\"\\n    shutil.rmtree(vdoc, ignore_errors=True)\\n    doc = td / \\\"doc\\\"\\n    if doc.is_dir() and not doc.is_symlink():\\n        shutil.move(str(doc), str(vdoc))\\n    ws = os.environ.get(\\\"GITHUB_WORKSPACE\\\", \\\"\\\")\\n    if ws and os.path.exists(os.path.join(ws, \\\".git\\\")):\\n        out = subprocess.check_output([\\\"git\\\", \\\"-C\\\", ws, \\\"ls-files\\\", \\\"-s\\\", \\\"-z\\\"])\\n        lines = []\\n        for entry in out.split(b\\\"\\\\0\\\"):\\n            if not entry:\\n                continue\\n            meta, rel_b = entry.split(b\\\"\\\\t\\\", 1)\\n            oid = meta.split()[1].decode()\\n            rel = rel_b.decode()\\n            full = os.path.join(ws, rel)\\n            if os.path.isfile(full) and not os.path.islink(full):\\n                lines.append(f\\\"{oid}\\\\t{os.stat(full).st_mtime_ns}\\\\t{rel}\\\\n\\\")\\n        (shims / \\\".velnor-source-oids\\\").write_text(\\\"\\\".join(lines))\\n\")'\\'' \"$target_dir\"; fi; mbx_disk_sample after-final-clean; exit \"$clean_status\"'"
  rust-playground-cli:
    name: Rust / playground-cli
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      MBX_BUILD_SCRIPT_EXECUTION: "0"
      MBX_CC: "0"
      MBX_GC_AUTO: "0"
      MBX_SHARE_OUT_DIR: "0"
      VELNOR_ASSET_SHA256: 5dbec74df7e8fface358305a1c7cb9d10437b262cd42422fe5f5c9ab801e3614
      VELNOR_ASSET_URL: https://github.com/tailrocks/velnor-new/releases/download/v0.1.10/velnor-actions-0.1.10-x86_64-unknown-linux-gnu
      VELNOR_RELEASE_COMMIT: 906d3e5cd715076c3663f8e811e39a16e4a2d3ca
    needs:
      - plan
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: V2 identity
        id: v2
        uses: ./.github/actions/velnor-tools-prelude-u26 # zizmor: ignore[self-repository]
        with:
          d: b2f1f1b13a2762e0e13503c99bdcc776ce2b34f3adb2a739bc4d561f81a9c79a
      - name: Restore Mise tools
        if: steps.v2.outputs.enabled == 'true'
        uses: ./.github/actions/velnor-tools-cache-restore # zizmor: ignore[self-repository]
        with:
          key: mise-tools-v2-${{steps.v2.outputs.identity}}
          seed-admitted: ${{ steps.v2.outputs.seed_admitted }}
      - name: Setup Mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
        with:
          cache: "false"
          cache_save: "false"
          env: "false"
          install: "false"
          sha256: c72477ae6c3a8e7d817a322f43da70e4643e75ee5c21265f1c19c894273b7428
          version: 2026.10.8
      - name: Acquire Velnor
        run: "sh -c 'unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR; d=\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.10\"&&mkdir -p \"${d%/*}\"&&s=\"/opt/velnor/seed/generator/${d##*/}\"&&p=\"$VELNOR_ASSET_SHA256  \"&&if [ -f \"$s\" ]&&echo \"$p$s\"|sha256sum -c -;then cp \"$s\" \"$d\";else curl -fsSL --retry 5 --retry-all-errors --proto '\\''=https'\\'' --tlsv1.2 \"$VELNOR_ASSET_URL\" -o \"$d\"&&echo \"$p$d\"|sha256sum -c -;fi&&chmod +x \"$d\"'"
      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: velnor-plan-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/velnor/r${{ github.run_id }}-a${{ github.run_attempt }}
      - name: Prepare pinned tools
        env:
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
        run: mise --no-config --no-env --no-hooks install rust@1.97.1 actionlint@1.7.12 shellcheck@0.11.0 zizmor@1.30.1 aqua:nextest-rs/nextest/cargo-nextest@0.9.148
      - name: Prepare Rust components
        env:
          CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
          RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
        run: mise --no-config --no-env --no-hooks exec rust@1.97.1 -- rustup component add --toolchain 1.97.1-x86_64-unknown-linux-gnu clippy rustfmt
      - name: Restore Cargo sources
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: velnor-v1-sources-x86_64-unknown-linux-gnu-1.97.1-${{hashFiles('Cargo.lock')}}
          path: "${{ runner.temp }}/velnor/cargo/registry/index\n${{ runner.temp }}/velnor/cargo/registry/cache\n${{ runner.temp }}/velnor/cargo/git/db"
          restore-keys: velnor-v1-sources-x86_64-unknown-linux-gnu-1.97.1-
      - name: Verify Rust before MBX action
        env:
          CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MBX_CACHE_DIR: ${{ runner.temp }}/velnor/mbx
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
