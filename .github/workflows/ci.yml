      - plan
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: V2 identity
        id: v2
        uses: ./.github/actions/velnor-tools-prelude-u26 # zizmor: ignore[self-repository]
        with:
          d: b2f1f1b13a2762e0e13503c99bdcc776ce2b34f3adb2a739bc4d561f81a9c79a
      - name: Restore Mise tools
        if: steps.v2.outputs.enabled == 'true'
