trust = "untrusted-ok"
[unit.capabilities]
docker = true
nested_privileged_docker = false
buildx_compose = false
testcontainers = true
services_with_readiness = false
browser_binaries = false
native_macos_arm64 = false
[unit.cache]
key_files = [".cargo/**", "Cargo.lock", "rust-toolchain.toml", "rust-toolchain"]
paths = ["~/.cargo/registry", "~/.cargo/git"]

[[unit]]
id = "swift-package-macos"
label = "Swift package (macos)"
kind = "swift"
root = "macos"
watch = ["macos/**/*.swift", "macos/.swiftpm/Package.resolved", "macos/Package.resolved", "macos/Package.swift", "macos/Sources/**", "macos/Tests/**"]
pr_commands = ["cd -- 'macos' && swift build", "cd -- 'macos' && swift test --parallel"]
full_commands = ["cd -- 'macos' && swift build", "cd -- 'macos' && swift test --parallel"]
tool_version = "5.9"
platform = "macos-arm64"
trust = "untrusted-ok"
[unit.capabilities]
docker = false
nested_privileged_docker = false
buildx_compose = false
testcontainers = false
services_with_readiness = false
browser_binaries = false
native_macos_arm64 = false
[unit.cache]
key_files = [".swift-version", ".xcode-version", "macos/.swiftpm/Package.resolved", "macos/Package.resolved", "macos/Package.swift", "mise.lock"]
paths = ["~/.swiftpm"]
