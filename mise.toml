[tools]
rust = { version = "1.97.1", profile = "minimal", components = ["rustfmt", "clippy"] }
actionlint = "1.7.12"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.143"
# Bun is the sole JavaScript/TypeScript runtime and package manager.
bun = "1.3.14"
# Java tier (catalog/payment/fulfillment) builds on the latest GraalVM LTS.
# Gradle toolchains in each service request Java 25; mise provisions the JDK.
java = "oracle-graalvm-25.0.4"
"aqua:protocolbuffers/protobuf/protoc" = "35.1"

[settings]
lockfile = true

[task_config]
includes = ["mise-scenarios.toml"]

[tasks.install]
description = "Provision every pinned tool from mise.lock"
run = "mise install --locked"

[tasks.build]
description = "Compile every workspace target with a real codegen build"
run = "cargo build --locked --workspace --all-targets --all-features"

[tasks.check]
description = "Compile the full Rust workspace with all targets and features"
run = "cargo check --locked --workspace --all-targets --all-features"

[tasks.nextest]
description = "Run the complete Rust workspace test suite"
run = "cargo nextest run --locked --workspace --profile ci --no-tests=fail"

[tasks.lint]
description = "Run strict Rust Clippy checks across the workspace"
run = "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"

[tasks.fmt]
description = "Check Rust formatting across the workspace"
run = "cargo fmt --all -- --check"

# Competitor lab fan-out proof (deploy/comparison/): one deterministic
# traces:deep trace must arrive in Parallax, Jaeger, and OpenObserve. A live
# check, not a registered scenario: the corpus gate counts proofs exactly.
[tasks."check:fanout"]
description = "Fan-out proof: one traces:deep trace arrives in Parallax, Jaeger, and OpenObserve"
run = "cargo run --locked -p playground-cli -- check-fanout"

[tasks."quality:java_catalog"]
description = "Run the Catalog Spring test suite"
dir = "services/catalog"
run = "java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain --no-daemon test -Dorg.gradle.native=false"

[tasks."quality:java_payment"]
description = "Run the Payment Spring test suite"
dir = "services/payment"
run = "java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain --no-daemon test -Dorg.gradle.native=false"

[tasks."quality:java_fulfillment"]
description = "Run the Fulfillment Spring test suite"
dir = "services/fulfillment"
run = "java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain --no-daemon test -Dorg.gradle.native=false"

[tasks."quality:java"]
description = "Run all Spring service test suites"
run = [
  { task = "quality:java_catalog" },
  { task = "quality:java_payment" },
  { task = "quality:java_fulfillment" },
]

[tasks."quality:web"]
description = "Run web tests, production build, and strict TypeScript checking"
dir = "web"
# The gate provisions its own dependencies: a clean checkout has no
# web/node_modules, and `--no-install` bunx would then have no vitest binary.
run = ["bun install --frozen-lockfile", "bun run test", "bun run build"]

[tasks.ci]
description = "Provision, build, and run every Rust, Spring, and web quality gate"
depends = [
  "install",
  "build",
  "check",
  "nextest",
  "lint",
  "fmt",
  "quality:java",
  "quality:web",
]

# Code-class CI lane gate: the test-bearing gates only, without the
# build/lint/fmt provisioning `ci` adds around them.
[tasks.test]
depends = ["nextest", "quality:java", "quality:web"]
