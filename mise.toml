[tools]
rust = { version = "1.97.1", profile = "minimal", components = ["rustfmt", "clippy"] }
actionlint = "1.7.12"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.143"
# Bun is the sole JavaScript/TypeScript runtime and package manager.
bun = "1.3.14"
# Java tier (catalog/payment/fulfillment) builds on the latest GraalVM LTS.
# Gradle toolchains in each service request Java 25; mise provisions the JDK.
java = "oracle-graalvm-25.0.4"
"aqua:protocolbuffers/protobuf/protoc" = "35.1"

[settings]
lockfile = true

[tasks.install]
description = "Provision every pinned tool from mise.lock"
run = "mise install --locked"

[tasks.build]
description = "Compile every workspace target with a real codegen build"
run = "cargo build --locked --workspace --all-targets --all-features"

[tasks.test]
run = "cargo nextest run --locked --workspace --profile ci --no-tests=fail"

[tasks.lint]
run = "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"

[tasks.fmt]
run = "cargo fmt --all -- --check"

[tasks.ci]
description = "Human aggregate: every gate the CI lane runs"
depends = ["install", "build", "test", "lint", "fmt"]
