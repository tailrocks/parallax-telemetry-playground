# Cross-language gRPC overlay. Keeps pricing on the Rust pricing service and
# points checkout/storefront at the Java payment service through the separate
# payment endpoint. A single distributed trace can then span Rust → Java over
# gRPC (W3C traceparent in gRPC metadata).
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.xlang.yml up -d checkout
#   curl -X POST http://localhost:8088/checkout \
#     -H 'content-type: application/json' \
#     --data '{"tenant_id":"tenant-acme","customer_id":"customer-acme-ava","items":[{"sku":"WIDGET-1","quantity":2}]}'
#
services:
  checkout:
    environment:
      PRICING_ENDPOINT: "http://pricing:50051"
      PAYMENT_ENDPOINT: "http://payment:9090"
    depends_on:
      pricing:
        condition: service_healthy
      payment:
        condition: service_healthy
  storefront:
    environment:
      PRICING_ENDPOINT: "http://pricing:50051"
      PAYMENT_ENDPOINT: "http://payment:9090"
    depends_on:
      pricing:
        condition: service_healthy
      payment:
        condition: service_healthy
