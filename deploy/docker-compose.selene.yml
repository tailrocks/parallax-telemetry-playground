# Selene overlay — route OTLP to shared Rotel on selene-observability.
# Deploy from /opt/selene-observability/playground on clickhouse-selene.
#
#   docker compose -f docker-compose.yml -f docker-compose.selene.yml up -d
#
# Never run demo:fresh against persistent Selene state.

name: selene-playground

x-selene-otlp: &selene-otlp
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://selene-rotel:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  PLAYGROUND_ENV: "selene"
  PARALLAX_ENV: "selene"

# Shared selene-observability network exposes multiple `postgres`/`redis` aliases
# from other stacks — pin playground deps to container names.
x-selene-deps: &selene-deps
  DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD:-playground}@selene-playground-postgres:5432/playground"
  POSTGRES_HOST: selene-playground-postgres
  REDIS_URL: "redis://selene-playground-redis:6379/0"
  REDIS_HOST: selene-playground-redis
  RABBITMQ_URL: "amqp://playground:${RABBITMQ_PASSWORD:-playground}@selene-playground-rabbitmq:5672/%2f"
  AMQP_URL: "amqp://playground:${RABBITMQ_PASSWORD:-playground}@selene-playground-rabbitmq:5672/%2f"
  RABBITMQ_HOST: selene-playground-rabbitmq
  CLICKHOUSE_URL: "http://selene-playground-clickhouse:8123"
  CLICKHOUSE_HTTP_URL: "http://selene-playground-clickhouse:8123"
  CLICKHOUSE_HOST: selene-playground-clickhouse
  CATALOG_DATABASE_URL: "jdbc:postgresql://selene-playground-postgres:5432/playground"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://selene-playground-postgres:5432/playground"
  PAYMENT_DATABASE_URL: "jdbc:postgresql://selene-playground-postgres:5432/playground"
  FULFILLMENT_DATABASE_URL: "jdbc:postgresql://selene-playground-postgres:5432/playground"

x-selene-service-networks: &selene-service-networks
  - pg
  - selene-observability

x-selene-logging: &selene-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  checkout:
    environment:
      <<: [*selene-otlp, *selene-deps]
    networks: *selene-service-networks
    logging: *selene-logging
    extra_hosts: []
    ports: !override ["8088:8088"]

  pricing:
    environment:
      <<: [*selene-otlp, *selene-deps]
    networks: *selene-service-networks
    logging: *selene-logging
    extra_hosts: []

  inventory:
    environment:
      <<: [*selene-otlp, *selene-deps]
    networks: *selene-service-networks
    logging: *selene-logging
    extra_hosts: []

  recommendation:
    environment:
      <<: [*selene-otlp, *selene-deps]
    networks: *selene-service-networks
    logging: *selene-logging
    extra_hosts: []

  notifications:
    environment:
      <<: [*selene-otlp, *selene-deps]
    networks: *selene-service-networks
    logging: *selene-logging
    extra_hosts: []

  orders:
    environment:
      <<: [*selene-otlp, *selene-deps]
    networks: *selene-service-networks
    logging: *selene-logging
    extra_hosts: []

  storefront:
    environment:
      <<: [*selene-otlp, *selene-deps]
    networks: *selene-service-networks
    logging: *selene-logging
    extra_hosts: []

  catalog:
    environment:
      <<: [*selene-otlp, *selene-deps]
    networks: *selene-service-networks
    logging: *selene-logging
    extra_hosts: []

  payment:
    environment:
      <<: [*selene-otlp, *selene-deps]
    networks: *selene-service-networks
    logging: *selene-logging
    extra_hosts: []

  fulfillment:
    environment:
      <<: [*selene-otlp, *selene-deps]
    networks: *selene-service-networks
    logging: *selene-logging
    extra_hosts: []

  web:
    environment:
      ROTEL_OTLP_HTTP_ENDPOINT: "http://selene-rotel:4318"
      VITE_PARALLAX_ENV: "selene"
    networks: *selene-service-networks
    logging: *selene-logging
    extra_hosts: []

  postgres-migrate:
    environment:
      PGHOST: selene-playground-postgres

  clickhouse-init:
    command:
      - /bin/sh
      - -ec
      - |
        clickhouse-client --host selene-playground-clickhouse --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --multiquery < /init/001-analytics.sql

  postgres:
    container_name: selene-playground-postgres
    ports: !override []
    networks: [pg]
    logging: *selene-logging
    volumes:
      - /srv/observability/playground/postgres:/var/lib/postgresql

  redis:
    container_name: selene-playground-redis
    ports: !override []
    networks: [pg]
    logging: *selene-logging
    volumes:
      - /srv/observability/playground/redis:/data

  rabbitmq:
    container_name: selene-playground-rabbitmq
    ports: !override []
    networks: [pg]
    logging: *selene-logging
    volumes:
      - /srv/observability/playground/rabbitmq:/var/lib/rabbitmq

  clickhouse:
    container_name: selene-playground-clickhouse
    ports: !override []
    networks: [pg]
    logging: *selene-logging
    volumes:
      - /srv/observability/playground/clickhouse:/var/lib/clickhouse
      - /srv/observability/playground/clickhouse-logs:/var/log/clickhouse-server

networks:
  selene-observability:
    external: true
    name: selene-observability

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  clickhouse_data:
  clickhouse_logs:
