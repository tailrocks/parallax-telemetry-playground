# Public scenario contract.
#
# Every scenario uses the same shape:
#   <capability-group>:<semantic_name>
#   description = "what it proves"
#   raw = true
#   run = "Rust scenario runner"
#
# Old letter/number identifiers are internal fixture names only. They are not
# mise aliases and are intentionally absent from this public task catalog.

["commerce:checkout_saga"]
